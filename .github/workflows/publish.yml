# Builds, tests and publishes the NuGet packages to nuget.org using trusted publishing (OIDC, no API key).
#
# - push to main:  prerelease  <VersionPrefix>-prerelease.<run_number>
# - push of v*:    release     version taken from the tag (v1.2.3 -> 1.2.3)
#
# nuget.org trusted publishing policy: owner d-velop, repo dvelop-sdk-cs, workflow publish.yml.
# TODO (needs repo admin): run the publish job in GitHub environments (nuget-prerelease for main,
# nuget-release with required reviewers for v* tags), add a second policy naming the environment.
# See https://github.com/d-velop/dvelop-sdk-cs/issues/230

name: "Publish to nuget.org"

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Determine version
        id: version
        run: |
          prefix=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' ./Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$prefix"* ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in Directory.Build.props"
              exit 1
            fi
          else
            version="$prefix-prerelease.$GITHUB_RUN_NUMBER"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release /p:Version="${{ steps.version.outputs.version }}"
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
      - name: Pack
        run: >
          dotnet pack --no-build -c Release -o dist
          /p:Version="${{ steps.version.outputs.version }}"
          /p:InformationalVersion="${{ steps.version.outputs.version }}+${{ github.ref_name }}/${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request the OIDC token used by NuGet/login and by the attestation
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.nupkg
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ckuetbach # nuget.org profile name (not a secret); the policy itself is owned by the d-velop org
      - name: Push packages
        run: >
          dotnet nuget push "dist/*.nupkg"
          -s https://api.nuget.org/v3/index.json
          -k "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

  release:
    # GitHub Release (with generated notes and the packages attached) for v* tags only
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
